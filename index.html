<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>119 작전도</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif; background: #0b1220; overflow: hidden; }

#page-map { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ══ 헤더 ══ */
#mapHeader { padding: 10px 12px 8px; background: rgba(13,20,40,0.97); border-bottom: 1px solid #1e293b; flex-shrink: 0; }
#headerTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#headerTitle { color: #94a3b8; font-size: 12px; font-weight: 700; }
#clockBlock { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
#clockRow { display: flex; align-items: baseline; gap: 8px; }
#clockLabel { color: #64748b; font-size: 10px; font-weight: 700; }
#clock { font-family: monospace; color: #38bdf8; font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }
#activeTimeRow { display: flex; align-items: baseline; gap: 8px; }
#activeTimeLabel { color: #f87171; font-size: 10px; font-weight: 700; }
#activeTime { font-family: monospace; color: #ef4444; font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }
#floorControls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
#floorControls label { color: #e2e8f0; font-size: 13px; display: flex; align-items: center; gap: 4px; }
.num-input { width: 50px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 14px; padding: 5px 4px; text-align: center; outline: none; }
#buildBtn { background: #dc2626; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; padding: 6px 14px; cursor: pointer; }
#pasteBtn { background: #0369a1; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; padding: 6px 14px; cursor: pointer; }
#customUnitRow { display: flex; gap: 6px; }
#customUnitInput { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 12px; padding: 6px 8px; outline: none; }
#customUnitInput::placeholder { color: #475569; }
#addUnitBtn { background: #065f46; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; padding: 6px 12px; cursor: pointer; }

#infoRow { display: flex; gap: 10px; align-items: center; }
#incidentTimes { flex: 4; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#incidentTimes label { color: #e2e8f0; font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.time-input { width: 56px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-size: 12px; padding: 5px 4px; text-align: center; outline: none; font-family: monospace; }
.count-input { width: 48px; }
.note-row { flex: 1 1 100%; }
.note-input { flex: 1; width: auto; font-family: inherit; text-align: left; color: #e2e8f0; }
#infoRow #customUnitRow { flex: 1; min-width: 0; }

#buildingWrapper { position: relative; flex: 1 1 auto; overflow: hidden; min-height: 60px; }
#fireIconsLayer { position: relative; height: 0; overflow: visible; pointer-events: none; z-index: 50; }
.fire-icon-item { position: absolute; font-size: 26px; line-height: 1; cursor: grab; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); pointer-events: auto; }
.fire-del { position: absolute; top: -6px; right: -8px; width: 15px; height: 15px; line-height: 15px; text-align: center; font-size: 9px; font-weight: 700; color: #fff; background: #ef4444; border-radius: 50%; cursor: pointer; }

#mapMain { flex: 1; display: flex; overflow: hidden; }

/* ══ 리사이저 ══ */
.resizer-col { width: 6px; flex-shrink: 0; cursor: col-resize; background: #1e293b; position: relative; }
.resizer-col:hover, .resizer-col.active { background: #38bdf8; }
.resizer-col::after { content: ''; position: absolute; top: 0; bottom: 0; left: -3px; right: -3px; }
.resizer-row { height: 6px; flex-shrink: 0; cursor: row-resize; background: #1e293b; position: relative; }
.resizer-row:hover, .resizer-row.active { background: #38bdf8; }
.resizer-row::after { content: ''; position: absolute; left: 0; right: 0; top: -3px; bottom: -3px; }

/* ══ 왼쪽 컬럼: 건물 + 기록 ══ */
#leftColumn { width: 80%; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#buildingArea { position: absolute; inset: 0; overflow-y: auto; padding: 8px 6px 8px 8px; }
#noBuildingMsg { color: #475569; font-size: 12px; text-align: center; margin-top: 30px; line-height: 1.8; }

.floor-zone { display: flex; align-items: stretch; min-height: 46px; margin-bottom: 2px; border-radius: 6px; border: 1.5px solid #1e293b; overflow: hidden; transition: border-color 0.12s; }
.floor-zone.ground { background: #0f1f35; }
.floor-zone.basement { background: #0a1520; }
.floor-zone.roof { background: #1a0a2e; border-color: #7c3aed; min-height: 34px; }
.floor-label { width: 45px; flex-shrink: 0; display: flex; align-items: center; justify-content: left; font-size: 10px; font-weight: 700; font-family: monospace; background: #1e293b; color: #94a3b8; }
.floor-zone.basement .floor-label { background: #162032; color: #64748b; }
.floor-zone.roof .floor-label { background: #2d1b69; color: #c4b5fd; }

.commander-slot { width: 70px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #1a1030; border-right: 1px solid #1e293b; border-left: 1px solid #1e293b; padding: 2px; transition: background 0.12s, border-color 0.12s; position: relative; }
.commander-slot.drag-over { background: rgba(250,204,21,0.15); border-color: #facc15; }
.commander-slot .placed-chip { padding: 2px 4px; font-size: 8px; }
.commander-slot .cs-hint { font-size: 9px; opacity: 0.35; pointer-events: none; }

.floor-content { flex: 1; display: flex; align-items: stretch; min-height: 46px; min-width: 0; }
.floor-zone.roof .floor-content { min-height: 34px; }
.floor-cell { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 3px; padding: 4px 3px; border-left: 1px dashed #1e293b; transition: background 0.12s; }
.floor-cell:first-child { border-left: none; }
.floor-cell::before { content: attr(data-zone); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: rgba(148,163,184,0.13); pointer-events: none; z-index: 0; font-family: monospace; }
.floor-cell > * { position: relative; z-index: 1; }
.floor-cell.drag-over, .staging-content.drag-over { background: rgba(56,189,248,0.12); }
.floor-zone.roof .floor-cell::before { font-size: 20px; }

.injury-input { width: 300px; flex-shrink: 0; background: #0f172a; border: none; border-left: 1px solid #1e293b; color: #facc15; font-size: 11px; padding: 2px 4px; text-align: center; outline: none; font-family: inherit; }
.injury-input::placeholder { color: #475569; font-size: 9px; }

.placed-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #0b1220; cursor: grab; user-select: none; -webkit-tap-highlight-color: transparent; white-space: nowrap; touch-action: none; }
.placed-chip .remove-x { font-size: 11px; opacity: 0.7; }

/* ══ 기록(타임라인) ══ */
#timelineSection { flex: 0 0 auto; padding: 8px; display: flex; flex-direction: column; height: 40%; overflow: hidden; }
#timelineInputRow { display: flex; gap: 5px; margin-bottom: 6px; }
#timelineTime { width: 58px; flex-shrink: 0; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 11px; padding: 5px 4px; text-align: center; outline: none; font-family: monospace; }
#timelineText { flex: 1; min-width: 0; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 12px; padding: 5px 8px; outline: none; }
#timelineAddBtn { background: #1d4ed8; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; padding: 5px 10px; cursor: pointer; flex-shrink: 0; }
#timelineList { flex: 1; overflow-y: auto; border-top: 1px solid #1a2740; }
.timeline-row { display: flex; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid #1a2740; font-size: 12px; }
.timeline-row .tl-time { font-family: monospace; color: #38bdf8; font-weight: 700; flex-shrink: 0; }
.timeline-row .tl-sep { color: #475569; flex-shrink: 0; }
.timeline-row .tl-text { flex: 1; color: #e2e8f0; word-break: break-all; }
.timeline-row .tl-del { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; flex-shrink: 0; padding: 2px 4px; }
.timeline-row .tl-time, .timeline-row .tl-text { cursor: text; }
.tl-edit-time, .tl-edit-text { background: #0f172a; border: 1px solid #38bdf8; border-radius: 4px; color: #e2e8f0; font-size: 12px; padding: 2px 4px; outline: none; font-family: inherit; }
.tl-edit-time { width: 52px; flex-shrink: 0; font-family: monospace; color: #38bdf8; }
.tl-edit-text { flex: 1; min-width: 0; }
#timelineEmpty { color: #475569; font-size: 11px; padding: 8px 4px; text-align: center; }

/* ══ 오른쪽 컬럼: 출동대 패널 ══ */
#unitPanel { flex: 1; min-width: 120px; overflow-y: auto; padding: 8px; }
.unit-section-label { font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.06em; padding: 2px 2px 5px; display: block; }
.unit-group-label { font-size: 10px; color: #94a3b8; font-weight: 700; margin: 8px 0 4px; padding-left: 2px; }
.unit-group-label:first-child { margin-top: 0; }
.unit-group-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-bottom: 4px; }
.unit-icon { position: relative; background: #111827; border: 1.5px solid #1e293b; border-radius: 9px; padding: 7px 4px; text-align: center; font-size: 10px; font-weight: 700; color: #e2e8f0; cursor: grab; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.2s; line-height: 1.3; }
.unit-icon .u-emoji { font-size: 18px; display: block; margin-bottom: 2px; }
.unit-icon.placed { opacity: 0.3; cursor: default; }
.unit-icon.custom { border-color: #4ade80 !important; }
.unit-delete-x { position: absolute; top: 1px; right: 2px; width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 9px; color: #ef4444; opacity: 0.55; cursor: pointer; border-radius: 50%; z-index: 2; }
.unit-delete-x:hover { opacity: 1; background: rgba(239,68,68,0.15); }
.unit-summary { font-size: 10px; color: #94a3b8; padding: 0 2px 6px; letter-spacing: 0.02em; }
#dragGhost { position: fixed; pointer-events: none; z-index: 9999; background: #1e3a5f; border: 2px solid #38bdf8; border-radius: 9px; padding: 7px 4px; text-align: center; font-size: 10px; font-weight: 700; color: #e2e8f0; width: 75px; opacity: 0.92; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); line-height: 1.3; }
#dragGhost .u-emoji { font-size: 18px; display: block; margin-bottom: 2px; }
.reset-btn { width: 100%; margin-top: 6px; padding: 7px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; font-size: 12px; cursor: pointer; }

#stagingSection { margin-top: 12px; }
.staging-zone { border-radius: 8px; border: 1.5px dashed #334155; background: #0d1626; min-height: 56px; padding: 6px; transition: border-color 0.12s, background 0.12s; }
.staging-content { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 44px; }
.staging-empty-msg { color: #475569; font-size: 11px; padding: 4px; }
#specialRow { display: flex; gap: 6px; margin-top: 8px; }
#specialRow > div { flex: 1; min-width: 0; }

/* ══ 협력기관 섹션 ══ */
#agencySection { margin-top: 8px; }
.agency-icons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.agency-icon { background: #111827; border: 1.5px solid #1e293b; border-radius: 9px; padding: 6px 5px; text-align: center; font-size: 9px; font-weight: 700; color: #e2e8f0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; min-width: 56px; line-height: 1.3; }
.agency-icon .a-emoji { font-size: 16px; display: block; margin-bottom: 2px; }
.agency-icon .a-time { font-family: monospace; color: #38bdf8; font-size: 12px; display: block; margin-top: 2px; cursor: text; }
</style>
</head>
<body>

<div id="page-map">
  <div id="mapHeader">
    <div id="headerTop">
      <span id="headerTitle">🗺️ 119 작전도</span>
      <div id="clockBlock">
        <div id="clockRow"><span id="clockLabel">현재 시간</span><span id="clock">00:00:00</span></div>
        <div id="activeTimeRow"><span id="activeTimeLabel">활동 시간</span><span id="activeTime">--:--</span></div>
      </div>
    </div>
    <div id="floorControls">
      <label>지상 <input class="num-input" id="groundFloors" type="number" min="1" max="150" value="5"> 층</label>
      <label>지하 <input class="num-input" id="basementFloors" type="number" min="0" max="20" value="1"> 층</label>
      <button id="buildBtn">🏢 건물 생성</button>
      <button id="pasteBtn" type="button">📋 붙여넣기</button>
    </div>
    <div id="infoRow">
      <div id="incidentTimes">
        <label>신고 <input class="time-input hhmm-input" id="timeReport" type="text" placeholder="15:53"></label>
        <label>선착대 도착 <input class="time-input hhmm-input" id="timeFirstArrival" type="text" placeholder="16:00"></label>
        <label>대응1단계 <input class="time-input hhmm-input" id="timeLevel1" type="text" placeholder="16:05"></label>
        <label>초진 <input class="time-input hhmm-input" id="timeInitial" type="text" placeholder="16:10"></label>
        <label>완진 <input class="time-input hhmm-input" id="timeComplete" type="text" placeholder="17:00"></label>
        <label>자력대피 <input class="time-input count-input" id="timeSelfEvac" type="text" placeholder="명"></label>
        <label>병원이송 <input class="time-input count-input" id="timeHospital" type="text" placeholder="명"></label>
        <label>부상 <input class="time-input count-input" id="timeInjured" type="text" placeholder="명"></label>
        <label>사망 <input class="time-input count-input" id="timeDeceased" type="text" placeholder="명"></label>
        <label class="note-row">비고 <input class="time-input note-input" id="deceasedNote" type="text" placeholder="기타관련 메모"></label>
      </div>
      <div id="customUnitRow">
        <input id="customUnitInput" type="text" placeholder="출동대 이름 직접 입력">
        <button id="addUnitBtn">➕</button>
      </div>
    </div>
  </div>
  <div id="mapMain">
    <div id="leftColumn">
      <div id="buildingWrapper">
        <div id="buildingArea">
          <div id="fireIconsLayer"></div>
          <div id="noBuildingMsg">⬆️ 층수를 입력하고<br>건물 생성을 누르거나<br>📋 붙여넣기를 누르세요</div>
        </div>
      </div>
      <div id="rowResizer" class="resizer-row"></div>
      <div id="timelineSection">
        <span class="unit-section-label">기록 — 시간 | 내용 (예: 10:00 | 완진)</span>
        <div id="timelineInputRow">
          <input id="timelineTime" type="text" placeholder="10:00">
          <input id="timelineText" type="text" placeholder="내용 입력">
          <button id="timelineAddBtn">＋</button>
        </div>
        <div id="timelineList"></div>
      </div>
    </div>
    <div id="colResizer" class="resizer-col"></div>
    <div id="unitPanel">
      <span class="unit-section-label">출동대 — 건물 층/단위지휘관 칸으로 끌어다 배치 (더블클릭: 이름 수정)</span>
      <div id="unitSummary" class="unit-summary"></div>
      <div id="unitGrid"></div>
      <button class="reset-btn" id="resetBtn">🔄 배치 초기화</button>
      <div id="stagingSection">
        <span class="unit-section-label">자원대기소 — 대기 중인 출동대</span>
        <div class="staging-zone">
          <div class="staging-content" id="staging-content" data-drop-type="staging"></div>
        </div>
        <div id="specialRow">
          <div>
            <span class="unit-section-label">임시의료소</span>
            <div class="staging-zone">
              <div class="staging-content" id="medical-content" data-drop-type="medical"></div>
            </div>
          </div>
          <div>
            <span class="unit-section-label">RIT</span>
            <div class="staging-zone">
              <div class="staging-content" id="rit-content" data-drop-type="rit"></div>
            </div>
          </div>
        </div>
        <div id="agencySection">
          <span class="unit-section-label">협력기관 — 클릭 시 시간 자동 기록 (시간 더블클릭: 수정) / 출동대도 끌어다 놓기 가능</span>
          <div class="staging-zone">
            <div class="agency-icons" id="agencyIcons"></div>
            <div class="staging-content" id="agency-content" data-drop-type="agency"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="dragGhost"><span class="u-emoji">🚒</span><span class="u-name"></span></div>

<script>
const STORAGE_KEY = 'fireOpsBoard_v3';

/* ── 출동대 그룹/이모지 ── */
function groupOf(name) {
  if (name.indexOf('구조') > -1) return 'rescue';
  if (name.indexOf('구급') > -1) return 'ambulance';
  return 'engine';
}
function unitEmoji(u) {
  const g = groupOf(u.name);
  return g === 'rescue' ? '🦺' : g === 'ambulance' ? '🚑' : '🚒';
}

const UNIT_COLORS = ["#38bdf8","#facc15","#4ade80","#fb923c","#c084fc","#f472b6","#22d3ee","#a3e635","#f87171","#818cf8","#34d399","#fbbf24","#60a5fa","#e879f9","#2dd4bf","#f97316"];

const DEFAULT_UNIT_NAMES = [
  "양천대","신정대","신트리대","신월대","목동대",
  "양천구조대","강서구조대","구로구조대","영등포구조대",
  "등촌대","화곡대","당산대","신도림대","고척대",
  "양천구급1","양천구급2","신정구급1","신트리구급"
];
let units = DEFAULT_UNIT_NAMES.map((name, i) => ({ name, color: UNIT_COLORS[i % UNIT_COLORS.length], custom: false }));

/* ── 협력기관 목록 ── */
const AGENCY_LIST = [
  { key: 'firefighter', label: '양천하나', emoji: '👨‍🚒' },
  { key: 'police', label: '경찰관', emoji: '👮' },
  { key: 'gas', label: '도시가스', emoji: '🔧' },
  { key: 'electric', label: '한국전력', emoji: '⚡' },
  { key: 'ecc', label: '긴급구조통제단', emoji: '🚨' }
];
let agencyTimes = {}; // key -> "HH:MM"

// placedMap[unitName] = { type: 'floor'|'commander'|'staging'|'medical'|'rit'|'agency', floorId?: string }
const ZONES = ['A', 'B', 'C', 'D'];
let placedMap = {};
let floorTexts = {};      // { floorId: "부상자 텍스트" }
let timeline = [];        // [{ time, text }]
let incidentTimes = { report: '', firstArrival: '', level1: '', initial: '', complete: '', selfEvac: '', hospital: '', injured: '', deceased: '' };
let deceasedNote = '';
let fireIcons = [{ id: 'fire1', left: 10, top: 10 }];
let built = false, ground = 5, basement = 1;
let panelSplit = { leftColPercent: 80, timelineHeightPx: null };

/* ══ 시계 + 활동 시간 ══ */
function updateClock() {
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
  updateActiveTime(now);
}
function parseHHMMToDate(str, ref) {
  if (!str) return null;
  const m = str.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if (isNaN(h) || isNaN(mi) || h > 23 || mi > 59) return null;
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), h, mi, 0, 0);
  if (d.getTime() > ref.getTime()) d.setDate(d.getDate() - 1); // 자정을 넘긴 경우 전날로 간주
  return d;
}
function updateActiveTime(now) {
  const el = document.getElementById('activeTime');
  const start = parseHHMMToDate(incidentTimes.firstArrival, now);
  if (!start) { el.textContent = '--:--'; return; }
  let diffMs = now.getTime() - start.getTime();
  if (diffMs < 0) diffMs = 0;
  const totalMin = Math.floor(diffMs / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  const p = n => String(n).padStart(2, '0');
  el.textContent = p(h) + '시간 ' + p(m) + '분';
}
updateClock();
setInterval(updateClock, 1000);

/* ══ 저장/불러오기 ══ */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ units, placedMap, floorTexts, timeline, incidentTimes, deceasedNote, fireIcons, agencyTimes, built, ground, basement, panelSplit }));
  } catch (e) {}
}
function loadState() {
  let s = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  if (!s) return;
  if (Array.isArray(s.units) && s.units.length) units = s.units;
  if (s.placedMap) placedMap = s.placedMap;
  if (s.floorTexts) floorTexts = s.floorTexts;
  if (Array.isArray(s.timeline)) timeline = s.timeline;
  if (s.incidentTimes) {
    incidentTimes = Object.assign({ report: '', firstArrival: '', level1: '', initial: '', complete: '', selfEvac: '', hospital: '', injured: '', deceased: '' }, s.incidentTimes);
    Object.keys(timeFieldMap).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = incidentTimes[timeFieldMap[id]] || '';
    });
  }
  if (typeof s.deceasedNote === 'string') {
    deceasedNote = s.deceasedNote;
    const el = document.getElementById('deceasedNote');
    if (el) el.value = deceasedNote;
  }
  if (Array.isArray(s.fireIcons) && s.fireIcons.length) fireIcons = s.fireIcons;
  if (s.agencyTimes) agencyTimes = s.agencyTimes;
  if (s.panelSplit) {
    panelSplit = Object.assign(panelSplit, s.panelSplit);
    applyPanelSplit();
  }
  if (s.built) {
    built = true;
    ground = s.ground || 5;
    basement = s.basement || 0;
    document.getElementById('groundFloors').value = ground;
    document.getElementById('basementFloors').value = basement;
    buildFloors(ground, basement);
    applyFloorTexts();
  }
}

/* ══ 출동대 그리드(그룹별) ══ */
function renderUnitGrid() {
  const container = document.getElementById('unitGrid');
  container.innerHTML = '';
  const groups = [
    { key: 'engine', label: '🚒 진압대' },
    { key: 'rescue', label: '🦺 구조대' },
    { key: 'ambulance', label: '🚑 구급대' }
  ];
  groups.forEach(g => {
    const list = units.filter(u => groupOf(u.name) === g.key);
    if (!list.length) return;
    const h = document.createElement('div');
    h.className = 'unit-group-label';
    h.textContent = g.label;
    container.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'unit-group-grid';
    list.forEach(u => {
      const isPlaced = !!placedMap[u.name];
      const div = document.createElement('div');
      div.className = 'unit-icon' + (isPlaced ? ' placed' : '') + (u.custom ? ' custom' : '');
      div.dataset.unitName = u.name;
      div.style.borderColor = isPlaced ? '#1e293b' : u.color + '66';
      div.innerHTML = '<span class="unit-delete-x">✕</span><span class="u-emoji">' + unitEmoji(u) + '</span><span class="u-name">' + escHtml(u.name) + '</span>';
      if (!isPlaced) div.addEventListener('pointerdown', e => { if (e.target.classList.contains('unit-delete-x')) return; onDragStart(e, u.name); });
      div.addEventListener('dblclick', e => { if (e.target.classList.contains('unit-delete-x')) return; onUnitDblClick(e, u.name); });
      div.querySelector('.unit-delete-x').addEventListener('click', e => {
        e.stopPropagation();
        deleteUnitEntirely(u.name);
      });
      grid.appendChild(div);
    });
    container.appendChild(grid);
  });
  updateUnitSummary();
}

/* ══ 출동대 완전 삭제(로스터에서 제거) ══ */
function deleteUnitEntirely(name) {
  units = units.filter(u => u.name !== name);
  delete placedMap[name];
  renderUnitGrid();
  renderPlacements();
  saveState();
}

/* ══ 출동대 종류별 집계 ══ */
function classifyUnit(name) {
  if (name.indexOf('구조') > -1) return 'rescue';
  if (name.indexOf('구급') > -1) return 'ambulance';
  if (name.indexOf('탱크') > -1) return 'tank';
  if (name.endsWith('대')) return 'pump';
  return 'etc';
}
function updateUnitSummary() {
  const el = document.getElementById('unitSummary');
  if (!el) return;
  const counts = { pump: 0, tank: 0, rescue: 0, ambulance: 0, etc: 0 };
  units.forEach(u => {
    const c = classifyUnit(u.name);
    counts[c]++;
  });
  el.textContent = '🚒펌프 ' + counts.pump + ' · 🛢️탱크 ' + counts.tank + ' · 🦺구조 ' + counts.rescue + ' · 🚑구급 ' + counts.ambulance + ' · ➕기타 ' + counts.etc;
}

document.getElementById('buildBtn').addEventListener('click', () => {

});

/* ══ 📋 붙여넣기: 북마클릿에서 복사한 JSON을 적용 ══ */
document.getElementById('pasteBtn').addEventListener('click', () => {
  const str = window.prompt('북마클릿에서 복사한 내용을 붙여넣어 주세요 (Ctrl+V 후 확인):', '');
  if (!str) return;
  let payload;
  try {
    payload = JSON.parse(str);
  } catch (e) {
    alert('올바른 데이터 형식이 아닙니다. 북마클릿을 다시 실행해 복사한 뒤 시도해주세요.');
    return;
  }
  applyPastedPayload(payload);
});

function applyPastedPayload(payload) {
  // 건물이 아직 생성되지 않은 첫 붙여넣기일 때만 층수를 적용해 건물을 생성합니다.
  // 이미 건물이 있는 상태(추가 편성 등으로 재붙여넣기)에서는 층 배치를 보존하기 위해 건물을 다시 만들지 않습니다.
  if (!built) {
    const g = Math.min(parseInt(payload.ground) || 5, 150);
    const b = Math.min(parseInt(payload.basement) || 0, 20);
    ground = g; basement = b; built = true;
    document.getElementById('groundFloors').value = g;
    document.getElementById('basementFloors').value = b;
    buildFloors(g, b);
  }

  const names = Array.isArray(payload.units) ? payload.units : [];
  let addedCount = 0;
  names.forEach(name => {
    if (!name) return;
    if (!units.find(u => u.name === name)) {
      units.push({ name, color: UNIT_COLORS[units.length % UNIT_COLORS.length], custom: true });
      addedCount++;
    }
    // 배치(자원대기소/임시의료소/RIT/협력기관/건물 내부)는 건드리지 않습니다 — 직접 드래그해 배치하세요.
  });

  renderUnitGrid();
  renderPlacements();
  saveState();
  alert('불러오기 완료: 지상 ' + ground + '층 / 지하 ' + basement + '층\n오른쪽 출동대 목록에 새로 추가된 차량 ' + addedCount + '개.\n(배치는 직접 드래그해주세요)');
}

function buildFloors(g, b) {
  const area = document.getElementById('buildingArea');
  // fireIconsLayer와 안내 문구를 제외한 층 요소만 제거
  Array.from(area.querySelectorAll('.floor-zone')).forEach(el => el.remove());
  const noMsg = document.getElementById('noBuildingMsg');
  if (noMsg) noMsg.remove();
  const layer = document.getElementById('fireIconsLayer');
  area.appendChild(makeFloor('RF', '옥상', 'roof'));
  for (let f = g; f >= 1; f--) area.appendChild(makeFloor(f + 'F', f + '층', 'ground'));
  for (let b2 = 1; b2 <= b; b2++) area.appendChild(makeFloor('B' + b2, '지하' + b2, 'basement'));
}

function makeFloor(id, label, type) {
  const d = document.createElement('div');
  d.className = 'floor-zone ' + type;
  const cells = ZONES.map(z =>
    '<div class="floor-cell" id="fc-' + id + '-' + z + '" data-zone="' + z + '" data-drop-type="floor" data-floor-id="' + id + '"></div>'
  ).join('');
  d.innerHTML =
    '<div class="floor-label">' + label + '</div>' +
    '<div class="commander-slot" data-drop-type="commander" data-floor-id="' + id + '"><span class="cs-hint">⭐</span></div>' +
    '<div class="floor-content">' + cells + '</div>' +
    '<input class="injury-input" id="inj-' + id + '" data-floor-id="' + id + '" placeholder="부상자">';
  const inj = d.querySelector('.injury-input');
  inj.addEventListener('input', () => { floorTexts[id] = inj.value; saveState(); });
  return d;
}

function applyFloorTexts() {
  Object.keys(floorTexts).forEach(fid => {
    const el = document.getElementById('inj-' + fid);
    if (el) el.value = floorTexts[fid];

}

/* ══ 사건 개요 시간/인원 (신고/선착대 도착/대응1단계/초진/완진/자력대피/병원이송/부상/사망) ══ */
const timeFieldMap = {
  timeReport: 'report', timeFirstArrival: 'firstArrival', timeLevel1: 'level1', timeInitial: 'initial', timeComplete: 'complete',
  timeSelfEvac: 'selfEvac', timeHospital: 'hospital', timeInjured: 'injured', timeDeceased: 'deceased'
};

function formatHHMM(raw) {
  const digits = raw.replace(/[^0-9]/g, '');
  if (digits.length === 4) return digits.slice(0, 2) + ':' + digits.slice(2);
  if (digits.length === 3) return '0' + digits[0] + ':' + digits.slice(1);
  return raw;
}
function formatCount(raw) {
  const digits = raw.replace(/[^0-9]/g, '');
  return digits ? digits + '명' : '';
}

Object.keys(timeFieldMap).forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => { incidentTimes[timeFieldMap[id]] = el.value; saveState(); });
  el.addEventListener('blur', () => {
    if (el.classList.contains('hhmm-input')) {
      if (el.value && el.value.indexOf(':') === -1) el.value = formatHHMM(el.value);
    } else if (el.classList.contains('count-input')) {
      el.value = formatCount(el.value);
    }
    incidentTimes[timeFieldMap[id]] = el.value;
    saveState();
  });
});

/* ══ 화재 발생 위치 아이콘 — 이동만 가능(건물 스크롤과 함께 움직임) ══ */
const buildingArea = document.getElementById('buildingArea');
let fireDragState = null;

function renderFireIcons() {
  const layer = document.getElementById('fireIconsLayer');
  layer.innerHTML = '';
  fireIcons.forEach(f => {
    const el = document.createElement('div');
    el.className = 'fire-icon-item';
    el.style.left = f.left + 'px';
    el.style.top = f.top + 'px';
    el.dataset.fireId = f.id;
    el.title = '드래그해서 이동';
    el.innerHTML = '🔥';
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      const areaRect = buildingArea.getBoundingClientRect();
      const curLeft = f.left, curTop = f.top;
      fireDragState = {
        id: f.id,
        offsetX: (e.clientX - areaRect.left + buildingArea.scrollLeft) - curLeft,
        offsetY: (e.clientY - areaRect.top + buildingArea.scrollTop) - curTop
      };
      document.addEventListener('pointermove', onFireMove);
      document.addEventListener('pointerup', onFireUp);
    });
    layer.appendChild(el);
  });
}
function onFireMove(e) {
  if (!fireDragState) return;
  const f = fireIcons.find(x => x.id === fireDragState.id);
  if (!f) return;
  const areaRect = buildingArea.getBoundingClientRect();
  let x = (e.clientX - areaRect.left + buildingArea.scrollLeft) - fireDragState.offsetX;
  let y = (e.clientY - areaRect.top + buildingArea.scrollTop) - fireDragState.offsetY;
  x = Math.max(0, Math.min(x, buildingArea.scrollWidth - 30));
  y = Math.max(0, Math.min(y, buildingArea.scrollHeight - 30));
  f.left = x; f.top = y;
  const el = document.querySelector('.fire-icon-item[data-fire-id="' + cssEsc(f.id) + '"]');
  if (el) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
}
function onFireUp() {
  document.removeEventListener('pointermove', onFireMove);
  document.removeEventListener('pointerup', onFireUp);
  fireDragState = null;
  saveState();
}

/* ══ 배치 렌더링 (placedMap이 유일한 소스) ══ */
function renderPlacements() {
  document.querySelectorAll('.floor-cell, .commander-slot').forEach(el => {
    if (el.classList.contains('commander-slot')) {
      el.innerHTML = '<span class="cs-hint">⭐</span>';

      el.innerHTML = '';
    }
  });
  ['staging-content', 'medical-content', 'rit-content', 'agency-content'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = ''; });

    if (loc.type === 'floor') target = document.getElementById('fc-' + loc.floorId + '-' + (loc.zone || 'A'));
    else if (loc.type === 'commander') target = document.querySelector('.commander-slot[data-floor-id="' + cssEsc(loc.floorId) + '"]');
    else if (loc.type === 'staging') target = document.getElementById('staging-content');
    else if (loc.type === 'medical') target = document.getElementById('medical-content');
    else if (loc.type === 'rit') target = document.getElementById('rit-content');

}
function emptyMsgIfNeeded(id, msg) {
  const el = document.getElementById(id);
  if (el && el.children.length === 0) el.innerHTML = '<span class="staging-empty-msg">' + msg + '</span>';
}

function makeChip(unitName) {
  const u = units.find(x => x.name === unitName);
  const chip = document.createElement('div');
  chip.className = 'placed-chip';
  chip.dataset.unitName = unitName;
  chip.style.background = u ? u.color : '#94a3b8';
  chip.innerHTML = (u ? unitEmoji(u) : '🚒') + ' ' + escHtml(unitName) + ' <span class="remove-x">✕</span>';
  chip.querySelector('.remove-x').addEventListener('click', e => {
    e.stopPropagation();
    delete placedMap[unitName];
    renderUnitGrid(); renderPlacements(); saveState();
  });
  chip.addEventListener('pointerdown', e => { if (e.target.classList.contains('remove-x')) return; onDragStart(e, unitName); });
  chip.addEventListener('dblclick', e => onUnitDblClick(e, unitName));
  return chip;
}

/* ══ 더블클릭 이름 수정 ══ */
function onUnitDblClick(e, unitName) {
  e.stopPropagation();
  const newName = prompt('출동대 이름 수정', unitName);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed || trimmed === unitName) return;
  if (units.find(u => u.name === trimmed)) { alert('이미 존재하는 이름입니다.'); return; }
  const u = units.find(x => x.name === unitName);
  if (!u) return;
  u.name = trimmed;
  if (placedMap[unitName]) { placedMap[trimmed] = placedMap[unitName]; delete placedMap[unitName]; }
  renderUnitGrid(); renderPlacements(); saveState();
}

/* ══ 공용 드래그 로직 ══ */
const ghost2 = document.getElementById('dragGhost');
let dragging = null, currentHL = null;

function onDragStart(e, unitName) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const u = units.find(x => x.name === unitName);
  if (!u) return;
  dragging = u;
  ghost2.querySelector('.u-emoji').textContent = unitEmoji(u);
  ghost2.querySelector('.u-name').textContent = u.name;
  ghost2.style.display = 'block';
  moveGhost2(e.clientX, e.clientY);
  document.addEventListener('pointermove', onPtrMove);
  document.addEventListener('pointerup', onPtrUp);
  document.addEventListener('pointercancel', onPtrUp);
}

function onPtrMove(e) {
  if (!dragging) return;
  moveGhost2(e.clientX, e.clientY);
  ghost2.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  ghost2.style.display = 'block';
  const target = el ? el.closest('[data-drop-type]') : null;
  if (currentHL && currentHL !== target) { currentHL.classList.remove('drag-over'); currentHL = null; }
  if (target && target !== currentHL) { target.classList.add('drag-over'); currentHL = target; }
}

function onPtrUp(e) {
  document.removeEventListener('pointermove', onPtrMove);
  document.removeEventListener('pointerup', onPtrUp);
  document.removeEventListener('pointercancel', onPtrUp);
  if (currentHL) { currentHL.classList.remove('drag-over'); currentHL = null; }
  ghost2.style.display = 'none';
  if (!dragging) { return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el ? el.closest('[data-drop-type]') : null;
  if (target) {
    const type = target.dataset.dropType;
    if (type === 'floor') placeUnit(dragging.name, { type: 'floor', floorId: target.dataset.floorId, zone: target.dataset.zone });
    else if (type === 'commander') placeUnit(dragging.name, { type: 'commander', floorId: target.dataset.floorId });
    else if (type === 'staging') placeUnit(dragging.name, { type: 'staging' });
    else if (type === 'medical') placeUnit(dragging.name, { type: 'medical' });
    else if (type === 'rit') placeUnit(dragging.name, { type: 'rit' });
    else if (type === 'agency') placeUnit(dragging.name, { type: 'agency' });
  }
  dragging = null;
}

function moveGhost2(x, y) { ghost2.style.left = (x - 38) + 'px'; ghost2.style.top = (y - 44) + 'px'; }

function placeUnit(unitName, location) {
  if (location.type === 'commander') {
    Object.keys(placedMap).forEach(k => {
      const v = placedMap[k];
      if (k !== unitName && v.type === 'commander' && v.floorId === location.floorId) delete placedMap[k];
    });
  }
  placedMap[unitName] = location;
  renderUnitGrid();
  renderPlacements();
  saveState();
}

function cssEsc(s) { return String(s).replace(/(["\\])/g, '\\$1'); }
function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ══ 협력기관 — 클릭 시 시간 자동 기록, 더블클릭으로 수동 수정 ══ */
function renderAgencyIcons() {
  const container = document.getElementById('agencyIcons');
  container.innerHTML = '';
  AGENCY_LIST.forEach(a => {
    const div = document.createElement('div');
    div.className = 'agency-icon';
    div.dataset.agencyKey = a.key;
    const timeVal = agencyTimes[a.key] || '';
    div.innerHTML = '<span class="a-emoji">' + a.emoji + '</span>' + escHtml(a.label) + '<span class="a-time">' + escHtml(timeVal || '--:--') + '</span>';
    div.addEventListener('click', e => {
      if (e.target.closest('.a-time')) return;
      agencyTimes[a.key] = currentTimeHHMM();
      renderAgencyIcons();
      saveState();
    });
    const timeSpan = div.querySelector('.a-time');
    timeSpan.addEventListener('dblclick', e => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.className = 'tl-edit-time';
      input.style.width = '46px';
      input.value = agencyTimes[a.key] || '';
      timeSpan.replaceWith(input);
      input.focus(); input.select();
      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        agencyTimes[a.key] = input.value.trim();
        renderAgencyIcons();
        saveState();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
    });
    container.appendChild(div);
  });
}

/* ══ 기록(타임라인) ══ */
function currentTimeHHMM() {
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  return p(now.getHours()) + ':' + p(now.getMinutes());
}
document.getElementById('timelineTime').value = currentTimeHHMM();
let timelineTimeManual = false;
const timelineTimeInput = document.getElementById('timelineTime');
timelineTimeInput.addEventListener('input', () => { timelineTimeManual = true; });
setInterval(() => {
  if (!timelineTimeManual && document.activeElement !== timelineTimeInput) {
    timelineTimeInput.value = currentTimeHHMM();
  }
}, 1000);

document.getElementById('timelineAddBtn').addEventListener('click', addTimelineEntry);
document.getElementById('timelineText').addEventListener('keydown', e => { if (e.key === 'Enter') addTimelineEntry(); });
function addTimelineEntry() {
  const timeEl = document.getElementById('timelineTime'), textEl = document.getElementById('timelineText');
  const time = timeEl.value.trim() || currentTimeHHMM();
  const text = textEl.value.trim();
  if (!text) return;
  timeline.push({ time, text });
  textEl.value = '';
  timeEl.value = currentTimeHHMM();
  timelineTimeManual = false;
  renderTimeline();
  saveState();
}
function renderTimeline() {
  const list = document.getElementById('timelineList');
  if (!timeline.length) { list.innerHTML = '<div id="timelineEmpty">기록이 없습니다.</div>'; return; }
  list.innerHTML = '';
  timeline.forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = 'timeline-row';

    const timeSpan = document.createElement('span');
    timeSpan.className = 'tl-time';
    timeSpan.textContent = entry.time;
    timeSpan.addEventListener('dblclick', () => editTimelineField(idx, 'time', timeSpan));

    const sep = document.createElement('span');
    sep.className = 'tl-sep';
    sep.textContent = '|';

    const textSpan = document.createElement('span');
    textSpan.className = 'tl-text';
    textSpan.textContent = entry.text;
    textSpan.addEventListener('dblclick', () => editTimelineField(idx, 'text', textSpan));

    const delBtn = document.createElement('button');
    delBtn.className = 'tl-del';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => { timeline.splice(idx, 1); renderTimeline(); saveState(); });

    row.appendChild(timeSpan); row.appendChild(sep); row.appendChild(textSpan); row.appendChild(delBtn);
    list.appendChild(row);
  });
  list.scrollTop = list.scrollHeight;
}

function editTimelineField(idx, field, spanEl) {
  const input = document.createElement('input');
  input.className = field === 'time' ? 'tl-edit-time' : 'tl-edit-text';
  input.value = timeline[idx][field];
  spanEl.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = () => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    if (v) timeline[idx][field] = v;
    renderTimeline();
    saveState();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
}

/* ══ 패널 리사이저(좌우/상하) ══ */
const leftColumn = document.getElementById('leftColumn');
const unitPanel = document.getElementById('unitPanel');
const mapMain = document.getElementById('mapMain');
const colResizer = document.getElementById('colResizer');
const timelineSection = document.getElementById('timelineSection');
const rowResizer = document.getElementById('rowResizer');

function applyPanelSplit() {
  leftColumn.style.width = panelSplit.leftColPercent + '%';
  if (panelSplit.timelineHeightPx) {
    timelineSection.style.height = panelSplit.timelineHeightPx + 'px';
  }
}

let colDrag = null;
colResizer.addEventListener('pointerdown', e => {
  e.preventDefault();
  colDrag = { startX: e.clientX, startWidth: leftColumn.getBoundingClientRect().width, mainWidth: mapMain.getBoundingClientRect().width };
  colResizer.classList.add('active');
  document.addEventListener('pointermove', onColMove);
  document.addEventListener('pointerup', onColUp);
});
function onColMove(e) {
  if (!colDrag) return;
  const dx = e.clientX - colDrag.startX;
  let newWidth = colDrag.startWidth + dx;
  const minW = colDrag.mainWidth * 0.35, maxW = colDrag.mainWidth * 0.9;
  newWidth = Math.max(minW, Math.min(newWidth, maxW));
  const pct = (newWidth / colDrag.mainWidth) * 100;
  leftColumn.style.width = pct + '%';
  panelSplit.leftColPercent = pct;
}
function onColUp() {
  document.removeEventListener('pointermove', onColMove);
  document.removeEventListener('pointerup', onColUp);
  colResizer.classList.remove('active');
  colDrag = null;
  saveState();
}

let rowDrag = null;
rowResizer.addEventListener('pointerdown', e => {
  e.preventDefault();
  rowDrag = { startY: e.clientY, startHeight: timelineSection.getBoundingClientRect().height, colHeight: leftColumn.getBoundingClientRect().height };
  rowResizer.classList.add('active');
  document.addEventListener('pointermove', onRowMove);
  document.addEventListener('pointerup', onRowUp);
});
function onRowMove(e) {
  if (!rowDrag) return;
  const dy = e.clientY - rowDrag.startY;
  let newHeight = rowDrag.startHeight - dy;
  const minH = 80, maxH = rowDrag.colHeight * 0.75;
  newHeight = Math.max(minH, Math.min(newHeight, maxH));
  timelineSection.style.height = newHeight + 'px';
  panelSplit.timelineHeightPx = newHeight;
}
function onRowUp() {
  document.removeEventListener('pointermove', onRowMove);
  document.removeEventListener('pointerup', onRowUp);
  rowResizer.classList.remove('active');
  rowDrag = null;
  saveState();
}

/* ══ 초기화 ══ */
loadState();
renderFireIcons();
renderUnitGrid();
renderPlacements();
renderTimeline();
renderAgencyIcons();
</script>
